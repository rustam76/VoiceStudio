[project]
name = "voicestudio-online-runtime"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
# Narration + tone-colour cloning. No ASR, translation, LLM, video or training stacks.
dependencies = [
  "fastapi<0.137", "uvicorn", "python-multipart>=0.0.31", "websockets", "scalar-fastapi",
  "pyyaml", "numpy==2.0.2", "soundfile", "scipy==1.18.0", "psutil>=7.2.2", "pillow>=12.1.0", "pydub",
  "torch==2.10.0", "torchaudio==2.10.0", "audioseal>=0.1.3", "pedalboard>=0.9.14,<0.9.21",
  "alembic>=1.16", "cryptography>=41", "huggingface_hub>=1.7", "hf-xet>=1.1", "httpx>=0.28.1",
  "socksio>=1.0", "truststore>=0.9", "num2words>=0.5.14", "supertonic==1.3.1",
]

[tool.uv]
package = false
# Preserve upstream runtime versions while removing unused dependency trees.
constraint-dependencies = [
  "alembic==1.19.1",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.14.2",
  "audioseal==0.2.0",
  "certifi==2026.10.23",
  "cffi==2.1.1",
  "click==8.4.2",
  "colorama==0.4.6",
  "cryptography==50.0.0",
  "docopt==0.6.2",
  "einops==0.8.2",
  "fastapi==0.136.3",
  "filelock==4.2.4",
  "flatbuffers==25.12.19",
  "fsspec==2026.7.0",
  "h11==0.16.0",
  "hf-xet==1.6.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "huggingface-hub==1.28.0",
  "idna==3.19",
  "jinja2==3.1.6",
  "mako==1.4.2",
  "markupsafe==3.0.3",
  "mpmath==1.3.0",
  "networkx==3.6.1",
  "num2words==0.5.14",
  "omegaconf==2.3.1",
  "onnxruntime==1.29.0",
  "packaging==26.3",
  "pedalboard==0.9.20",
  "pillow==13.0.0",
  "protobuf==7.36.0",
  "psutil==7.2.2",
  "pycparser==3.0",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "pydub==0.25.1",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "scalar-fastapi==1.8.2",
  "setuptools==79.0.1",
  "socksio==1.0.0",
  "soundfile==0.14.0",
  "sqlalchemy==2.0.52",
  "starlette==1.6.0",
  "supertonic==1.3.1",
  "sympy==1.14.0",
  "tqdm==4.70.0",
  "truststore==0.10.4",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "uvicorn==0.52.4",
  "websockets==17.0.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "jsonschema"]
