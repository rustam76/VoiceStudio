[project]
name = "voicestudio-online-runtime"
version = "0.5.7"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3", "uvicorn==0.52.4", "python-multipart==0.0.32",
  "httpx==0.28.1", "mcp==1.30.0", "supertonic==1.3.1",
  "torch==2.8.0", "torchaudio==2.8.0", "numpy==2.2.6", "soundfile==0.14.0",
  "pydub==0.25.1", "psutil==7.2.2", "pillow==13.0.0", "num2words==0.5.14",
  "pyyaml==6.0.3", "cryptography==50.0.0", "alembic==1.19.1",
  "huggingface-hub==1.28.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
