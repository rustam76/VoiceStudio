name: VoiceStudio Web CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.detect.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo runtime=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Ev '^(docs/|tests/|changelog.d/|README[^/]*$)|\.md$' | grep -q .; then
            echo runtime=true >> "$GITHUB_OUTPUT"
          else
            echo runtime=false >> "$GITHUB_OUTPUT"
          fi
  tests:
    name: Tests (backend + frontend)
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --project deploy/online --frozen --no-default-groups --group dev
      - name: Offline backend checks
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          HF_HUB_CACHE: /tmp/online-ci-empty-hf-cache
        run: uv run --project deploy/online --no-sync python -m pytest tests/test_docker_entrypoint.py tests/test_model_acceptance.py tests/test_admin_sessions.py tests/test_auth_principal.py tests/test_app_version.py tests/test_app_config.py tests/test_studio_lite.py -q
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:frontend && bun run typecheck && bun run test
      - name: Build web and CPU container
        if: needs.changes.outputs.runtime == 'true'
        run: |
          bun run build:web
          docker build -f deploy/online/Dockerfile -t voicestudio-online:ci .
          OMNIVOICE_API_KEY=ci-config-validation-only docker compose config --quiet
      - name: Explicit docs/test-only build skip
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'Runtime build skipped for documentation/test-only changes; tests ran above.'
